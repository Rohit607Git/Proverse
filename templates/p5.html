{% extends "header2.html" %}
{% block titleweb %}
  <title>ProVerse | Edit Task</title>
{% endblock %}
{% block contentweb %}
<div id="messBox" class="messstyle {% if error %}show{% endif %}">
    <span  id="messText">{{error|default:''}}</span>
    <button class="close-btn" onclick="removemess()">&times;</button>
</div>
    <h1>Edit Task</h1>
    <div class="container">
      <form action="#" method="post">
        {% csrf_token %}
        <label for="title">Task Title</label>
        <input type="text" id="title" name="title" value="{{ task.title }}">
        <label for="description">Task Description</label>
        <textarea class="longtextwidth" id="description" name="description" rows="5">{{ task.description }}</textarea>
        <label for="assigned_to">Assigned To</label>
        <select id="assigned_to" name="assigned_to">
          <option value="" {% if not task.assigned_to %}selected{% endif %}>-- Select Member --</option>
          {% for team in teams %}
          {% if team.user.id == task.project.created_by.id %}
          <option value="{{team.id}}" {% if task.assigned_to.id == team.id %}selected{% endif %}>You</option>
          {% else %}
          <option value="{{team.id}}" {% if task.assigned_to.id == team.id %}selected{% endif %}>{{team.user.username}}</option>
          {% endif %}
          {% endfor %}
        </select>
        <label for="status">Status</label>
        <select id="status" name="status">
          <option value="ToDo" {% if task.status == 'ToDo' %}selected{% endif %}>ToDo</option>
          <option value="InProgress" {% if task.status == 'InProgress' %}selected{% endif %}>InProgress</option>
          <option value="Done" {% if task.status == 'Done' %}selected{% endif %}>Done</option>
        </select>
        <label for="priority">Priority</label>
        <select id="priority" name="priority">
          <option value="Low" {% if task.priority == 'Low' %}selected{% endif %}>Low</option>
          <option value="Medium" {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>
          <option value="High" {% if task.priority == 'High' %}selected{% endif %}>High</option>
        </select>
        <label for="due_date">Due Date</label>
        <input type="date" id="due_date" name="due_date" value="{{ task.due_date }}">
        <div class="btn-layout">
          <input type="hidden" name="pid" value="{% if task.id %}{{ task.id }}{% else %}{{ task.pid }}{% endif %}">
          <button class="btn save-btn" name="action" value="task_save" onclick="return jsValidateForm();">Save Changes</button>
          <button class="btn cancel-btn" name="action" value="task_cancel">Cancel</button>
          <button class="btn delete-btn" name="action" value="task_delete">Delete Task</button>
        </div>
      </form>
    </div>
  <script src="/static/mess_show.js"></script>
  <script>
    function jsValidateForm(){
        const t=document.getElementById("title").value.trim();
        const d=document.getElementById("description").value.trim();
        const s=document.getElementById("status").value.trim();
        const p=document.getElementById("priority").value.trim();
        const dd=document.getElementById("due_date").value.trim();
        if(t==="" || d==="" || s==="" || p==="" || dd===""){
            messbox.classList.add('show');
            messText.innerText="All Fields Are Required!";
            return false;
        }
        return true;}
  </script>
{% endblock %}
