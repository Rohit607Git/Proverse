{% extends "header2.html" %}
{% block titleweb %}
  <title>ProVerse | Edit Project</title>
{% endblock %}
{% block contentweb %}
<div id="messBox" class="messstyle {% if error %}show{% endif %}">
    <span  id="messText">{{error|default:''}}</span>
    <button class="close-btn" onclick="removemess()">&times;</button>
</div>
<h1>Edit Project</h1>
<div class="container">
  <form action="#" method="post">
    {% csrf_token %}
    <label for="title">Project Title</label>
    <input type="text" id="title" name="title" value="{{ project.title }}">
    <label for="description">Project Description</label>
    <textarea class="longtextwidth" id="description" name="description" rows="5">{{ project.description }}</textarea>
    <label for="status">Project Visibility</label>
    <select id="status" name="status">
      <option value="Public" {% if project.status == 'Public' %}selected{% endif %}>Public</option>
      <option value="Private" {% if project.status == 'Private' %}selected{% endif %}>Private</option>
    </select>
    <label for="start_date">Start Date</label>
    <input type="date" id="start_date" name="start_date" value="{{project.start_date}}">
    <label for="end_date">End Date</label>
    <input type="date" id="end_date" name="end_date" value="{{project.end_date}}">
    <div class="btn-layout">
      <input type="hidden" name="pid" value="{% if project.id %}{{ project.id }}{% else %}{{ project.pid }}{% endif %}">
      <button type="submit" class="btn save-btn" name="action" value="save" onclick="return jsValidateForm()">Save Changes</button>
      <button class="btn cancel-btn" name="action" value="view">Cancel</button>
    </form>
    </div>
</div>
<script src="/static/mess_show.js"></script>
<script>
  function jsValidateForm(){
    const t=document.getElementById("title").value.trim();
    const d=document.getElementById("description").value.trim();
    const s=document.getElementById("status").value.trim();
    const sd=document.getElementById("start_date").value.trim();
    const ed=document.getElementById("end_date").value.trim();
    if(t==="" || d==="" || s==="" || sd==="" || ed===""){
        messbox.classList.add('show');
        messText.innerText="All Fields Are Required!"
        return false;
    }
    else if(new Date(sd)>=new Date(ed)){
        messbox.classList.add('show');
        messText.innerText="Please Enter End Date Must After The Start Date"
        return false;
    }
    return true;}
</script>
{% endblock %}
